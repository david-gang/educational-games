<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Personal Arcade</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #eef2ff;
      background: #101629;
    }
    main { max-width: 60rem; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin-bottom: 0; }
    header p { color: #c3cce4; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
      gap: 1rem;
    }
    .game {
      display: block;
      padding: 1.5rem;
      border: 2px solid #6f82b4;
      border-radius: 1rem;
      background: #1d2945;
      color: inherit;
      text-decoration: none;
    }
    .game:hover { background: #2b3c61; }
    .game:focus-visible { outline: 3px solid #ffd166; outline-offset: 4px; }
    .game h3 { margin: 0 0 0.5rem; }
    .game p { margin: 0; }
    .empty {
      padding: 2rem;
      border: 2px dashed #6f82b4;
      border-radius: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Our Personal Arcade</h1>
      <p>A little collection of games for learning, exploring, and having fun.</p>
    </header>
    <section aria-labelledby="games-heading">
      <h2 id="games-heading">Choose a game</h2>
      <div class="games">
        <p class="empty">No games yet. Our first adventure is coming soon!</p>
      </div>
    </section>
  </main>
</body>
</html>
