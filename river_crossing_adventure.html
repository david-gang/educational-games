<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>River Crossing Adventure!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .font-heading {
      font-family: 'Fredoka One', cursive;
    }
    /* Custom button animations and shadows */
    .btn-pop {
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-pop:hover {
      transform: scale(1.05);
    }
    .btn-pop:active {
      transform: scale(0.95);
    }
    /* Gentle floating animation for UI badges */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-sky-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-slate-800 overflow-x-hidden">

  <!-- Header / Top Bar -->
  <header class="w-full max-w-4xl flex flex-wrap justify-between items-center bg-white/90 backdrop-blur-md rounded-2xl p-3 sm:p-4 shadow-lg border-2 border-sky-200 gap-2 z-10">
    <div class="flex items-center gap-3">
      <div class="bg-amber-400 p-2 sm:p-3 rounded-2xl text-2xl sm:text-3xl shadow-inner animate-float">
        ⛵
      </div>
      <div>
        <h1 class="font-heading text-xl sm:text-2xl text-sky-600 leading-tight">River Crossing!</h1>
        <p class="text-xs sm:text-sm text-slate-500 font-bold">Help everyone cross safely!</p>
      </div>
    </div>

    <!-- Stats & Actions -->
    <div class="flex items-center gap-2 sm:gap-4">
      <div class="bg-sky-50 border border-sky-200 px-3 py-1.5 rounded-xl text-center">
        <span class="text-xs text-slate-400 uppercase font-extrabold block leading-none">Moves</span>
        <span id="moveCount" class="font-heading text-lg sm:text-xl text-sky-700">0</span>
      </div>

      <div class="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl text-center">
        <span class="text-xs text-amber-500 uppercase font-extrabold block leading-none">Target</span>
        <span class="font-heading text-lg sm:text-xl text-amber-600">7</span>
      </div>

      <button id="soundToggleBtn" class="btn-pop bg-slate-100 hover:bg-slate-200 text-slate-700 p-2.5 rounded-xl font-bold text-lg shadow-sm border border-slate-300" title="Toggle Sound">
        🔊
      </button>

      <button id="restartBtn" class="btn-pop bg-emerald-500 hover:bg-emerald-600 text-white font-heading px-3 sm:px-4 py-2 rounded-xl shadow-md border-b-4 border-emerald-700 flex items-center gap-1 text-sm sm:text-base">
        🔄 Reset
      </button>
    </div>
  </header>

  <!-- Main Game Canvas Container -->
  <main class="w-full max-w-4xl relative my-2 sm:my-4 flex-1 flex flex-col justify-center items-center">
    <div class="relative w-full aspect-[16/9] max-h-[70vh] rounded-3xl overflow-hidden shadow-2xl border-4 border-white bg-sky-300">
      <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

      <!-- Overlay Game Instructions / Helper Bar -->
      <div id="instructionBanner" class="absolute top-3 left-1/2 transform -translate-x-1/2 bg-white/85 backdrop-blur-sm px-4 py-1.5 rounded-full shadow-md border border-white/60 text-xs sm:text-sm font-bold text-slate-700 text-center max-w-[90%] pointer-events-none transition-all duration-300">
        👇 Tap characters to load/unload into the boat!
      </div>
    </div>
  </main>

  <!-- Controls & Hint Bar -->
  <footer class="w-full max-w-4xl flex justify-between items-center gap-3 bg-white/90 backdrop-blur-md p-3 rounded-2xl shadow-lg border-2 border-sky-200 z-10">
    <button id="hintBtn" class="btn-pop bg-amber-400 hover:bg-amber-500 text-amber-950 font-heading px-4 py-2.5 rounded-xl shadow-md border-b-4 border-amber-600 flex items-center gap-2 text-sm sm:text-base">
      💡 Need a Hint?
    </button>

    <div id="hintBubble" class="hidden flex-1 bg-amber-50 border border-amber-200 text-amber-900 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold animate-pulse">
      Hint will appear here...
    </div>

    <button id="sailBtn" class="btn-pop bg-sky-500 hover:bg-sky-600 text-white font-heading px-6 py-2.5 rounded-xl shadow-lg border-b-4 border-sky-700 text-base sm:text-lg flex items-center gap-2">
      ⛵ Cross River!
    </button>
  </footer>

  <!-- Modal Dialog (Victory / Game Over / Rules) -->
  <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="modalCard" class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl text-center transform scale-90 transition-transform duration-300 border-4 border-sky-200 relative overflow-hidden">
      
      <!-- Graphic Header inside Modal -->
      <div id="modalEmoji" class="text-6xl sm:text-7xl mb-3 animate-bounce">
        🎉
      </div>

      <h2 id="modalTitle" class="font-heading text-2xl sm:text-3xl text-slate-800 mb-2">
        Awesome Job!
      </h2>

      <p id="modalDescription" class="text-slate-600 text-sm sm:text-base font-semibold mb-6">
        You crossed the river safely!
      </p>

      <!-- Rating Stars for Victory -->
      <div id="starContainer" class="flex justify-center gap-2 text-3xl mb-6 hidden">
        <span class="star opacity-30 transition-all duration-300">⭐</span>
        <span class="star opacity-30 transition-all duration-300">⭐</span>
        <span class="star opacity-30 transition-all duration-300">⭐</span>
      </div>

      <button id="modalActionBtn" class="btn-pop w-full bg-emerald-500 hover:bg-emerald-600 text-white font-heading py-3.5 rounded-2xl shadow-lg border-b-4 border-emerald-700 text-lg">
        Play Again 🚀
      </button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       SOUND SYNTHESIZER (Web Audio API)
       ========================================================================== */
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }

      playSplash() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.3);
      }

      playPop() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.1);
      }

      playOops() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.4);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.4);
      }

      playWin() {
        if (this.muted || !this.ctx) return;
        const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime + idx * 0.12;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.3);
        });
      }
    }

    const sound = new SoundEffects();

    /* ==========================================================================
       GAME ENGINE & STATE
       ========================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Positions: 'left', 'boat', 'right'
    let state = {
      boatPos: 'left', // 'left' or 'right'
      farmer: 'left',
      wolf: 'left',
      sheep: 'left',
      cabbage: 'left',
      moves: 0,
      isSailing: false,
      isGameOver: false,
      eatAnimation: null // null or { type: 'wolf'|'sheep', timer: 0 }
    };

    // Solution path for Hint Generator
    const OPTIMAL_STEPS = [
      { boat: 'left',  take: 'sheep' },
      { boat: 'right', take: null },
      { boat: 'left',  take: 'wolf' }, // or cabbage
      { boat: 'right', take: 'sheep' },
      { boat: 'left',  take: 'cabbage' }, // or wolf
      { boat: 'right', take: null },
      { boat: 'left',  take: 'sheep' }
    ];

    // Character Emoji definitions & Visual dimensions
    const CHARACTERS = {
      farmer:  { emoji: '👨‍🌾', name: 'Farmer',  color: '#e0f2fe' },
      wolf:    { emoji: '🐺', name: 'Wolf',    color: '#f1f5f9' },
      sheep:   { emoji: '🐑', name: 'Sheep',   color: '#fef3c7' },
      cabbage: { emoji: '🥬', name: 'Cabbage', color: '#dcfce7' }
    };

    // Canvas scaling logic
    let width = 800;
    let height = 450;

    function resizeCanvas() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      width = canvas.width;
      height = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Boat position X during animation (0 = Left shore, 1 = Right shore)
    let boatProgress = 0; 

    /* ==========================================================================
       DRAWING FUNCTIONS
       ========================================================================== */
    let waveOffset = 0;

    function render() {
      ctx.clearRect(0, 0, width, height);

      // 1. Sky & Background Elements
      ctx.fillStyle = '#bae6fd'; // Light sky blue
      ctx.fillRect(0, 0, width, height * 0.45);

      // Sun
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.arc(width * 0.5, height * 0.12, 35, 0, Math.PI * 2);
      ctx.fill();

      // Fluffy Clouds
      drawCloud(width * 0.15, height * 0.1, 0.8);
      drawCloud(width * 0.75, height * 0.15, 1.1);

      // 2. River Bank Lands
      const landWidth = width * 0.28;
      
      // Left Shore
      ctx.fillStyle = '#86efac';
      ctx.beginPath();
      ctx.moveTo(0, height * 0.35);
      ctx.quadraticCurveTo(landWidth * 0.8, height * 0.38, landWidth, height);
      ctx.lineTo(0, height);
      ctx.fill();

      // Right Shore
      ctx.fillStyle = '#86efac';
      ctx.beginPath();
      ctx.moveTo(width, height * 0.35);
      ctx.quadraticCurveTo(width - landWidth * 0.8, height * 0.38, width - landWidth, height);
      ctx.lineTo(width, height);
      ctx.fill();

      // Dirt/Sand edges
      ctx.fillStyle = '#fde047';
      ctx.globalAlpha = 0.3;
      ctx.fillRect(landWidth - 10, height * 0.5, 12, height * 0.5);
      ctx.fillRect(width - landWidth - 2, height * 0.5, 12, height * 0.5);
      ctx.globalAlpha = 1.0;

      // 3. Flowing River with Waves
      const riverStart = landWidth * 0.8;
      const riverEnd = width - landWidth * 0.8;
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(riverStart, height * 0.42, riverEnd - riverStart, height * 0.58);

      // Animated wave lines
      waveOffset += 0.03;
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 3;
      for (let y = height * 0.48; y < height; y += 22) {
        ctx.beginPath();
        for (let x = riverStart; x < riverEnd; x += 20) {
          const waveY = y + Math.sin(x * 0.02 + waveOffset) * 4;
          if (x === riverStart) ctx.moveTo(x, waveY);
          else ctx.lineTo(x, waveY);
        }
        ctx.stroke();
      }

      // 4. Wooden Boat
      const boatWidth = width * 0.24;
      const boatHeight = height * 0.14;

      // Calculate Boat X based on progress
      const leftBoatX = landWidth - 10;
      const rightBoatX = width - landWidth - boatWidth + 10;
      const boatX = leftBoatX + (rightBoatX - leftBoatX) * boatProgress;
      const boatY = height * 0.65 + Math.sin(waveOffset * 2) * 3; // Bobbing effect

      // Draw Wooden Boat Shape
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.moveTo(boatX, boatY);
      ctx.lineTo(boatX + boatWidth, boatY);
      ctx.quadraticCurveTo(boatX + boatWidth * 0.85, boatY + boatHeight, boatX + boatWidth * 0.6, boatY + boatHeight);
      ctx.lineTo(boatX + boatWidth * 0.4, boatY + boatHeight);
      ctx.quadraticCurveTo(boatX + boatWidth * 0.15, boatY + boatHeight, boatX, boatY);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#78350f';
      ctx.stroke();

      // Boat Rim Detail
      ctx.fillStyle = '#d97706';
      ctx.fillRect(boatX - 4, boatY - 4, boatWidth + 8, 8);

      // 5. Render Characters
      // Define positions for Left Shore, Boat, and Right Shore
      const shoreY = height * 0.52;
      const charSize = Math.min(width, height) * 0.11;

      // Left Shore Spots
      const leftSpots = [
        { x: width * 0.06, y: shoreY },
        { x: width * 0.15, y: shoreY + 20 },
        { x: width * 0.08, y: shoreY + 70 },
        { x: width * 0.18, y: shoreY + 80 }
      ];

      // Right Shore Spots
      const rightSpots = [
        { x: width * 0.94 - charSize, y: shoreY },
        { x: width * 0.85 - charSize, y: shoreY + 20 },
        { x: width * 0.92 - charSize, y: shoreY + 70 },
        { x: width * 0.82 - charSize, y: shoreY + 80 }
      ];

      // Boat Spots
      const boatSpots = [
        { x: boatX + boatWidth * 0.15, y: boatY - charSize * 0.45 },
        { x: boatX + boatWidth * 0.52, y: boatY - charSize * 0.45 }
      ];

      // Track occupied slots
      let leftIdx = 0, rightIdx = 0, boatIdx = 0;

      // Store clickable regions
      window.interactiveBounds = [];

      ['farmer', 'wolf', 'sheep', 'cabbage'].forEach((key) => {
        const char = CHARACTERS[key];
        const pos = state[key];
        let coords = { x: 0, y: 0 };

        if (pos === 'left') {
          coords = leftSpots[leftIdx++];
        } else if (pos === 'right') {
          coords = rightSpots[rightIdx++];
        } else if (pos === 'boat') {
          coords = boatSpots[boatIdx++];
        }

        // Draw Character Box / Card
        drawCharacterCard(key, char.emoji, coords.x, coords.y, charSize, pos);

        // Store click target
        window.interactiveBounds.push({
          key: key,
          x: coords.x,
          y: coords.y,
          size: charSize,
          pos: pos
        });
      });

      // 6. Draw Eating/Failure Drama Overlay Animation if triggered
      if (state.eatAnimation) {
        drawEatAnimation();
      }

      requestAnimationFrame(render);
    }

    function drawCloud(x, y, scale) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, 18 * scale, 0, Math.PI * 2);
      ctx.arc(x + 15 * scale, y - 10 * scale, 22 * scale, 0, Math.PI * 2);
      ctx.arc(x + 35 * scale, y, 18 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCharacterCard(key, emoji, x, y, size, pos) {
      // Glow/Highlight background circle
      ctx.save();
      
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(x + size/2, y + size * 0.85, size * 0.4, size * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // Card Background
      ctx.fillStyle = CHARACTERS[key].color;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = pos === 'boat' ? 3 : 2;
      
      ctx.beginPath();
      ctx.roundRect(x, y, size, size, 16);
      ctx.fill();
      ctx.stroke();

      // Emoji
      ctx.font = `${size * 0.55}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, x + size / 2, y + size / 2);

      ctx.restore();
    }

    function drawEatAnimation() {
      const anim = state.eatAnimation;
      anim.timer += 0.02;

      ctx.save();
      ctx.fillStyle = 'rgba(239, 68, 68, 0.25)'; // Soft red alert glow
      ctx.fillRect(0, 0, width, height);

      ctx.font = 'bold 42px Fredoka One, cursive';
      ctx.fillStyle = '#dc2626';
      ctx.textAlign = 'center';

      if (anim.type === 'wolf_eat_sheep') {
        ctx.fillText('GULP! 🐺 The Wolf ate the Sheep! 🐑', width / 2, height * 0.3);
      } else if (anim.type === 'sheep_eat_cabbage') {
        ctx.fillText('CHOMP! 🐑 The Sheep ate the Cabbage! 🥬', width / 2, height * 0.3);
      }
      ctx.restore();
    }

    /* ==========================================================================
       GAME LOGIC & INTERACTION
       ========================================================================== */

    // Load or Unload character from boat
    function handleCharacterClick(key) {
      if (state.isSailing || state.isGameOver) return;

      sound.init();
      const currentPos = state[key];

      if (currentPos === 'boat') {
        // Unload onto shore where boat currently is
        state[key] = state.boatPos;
        sound.playPop();
      } else if (currentPos === state.boatPos) {
        // Load into boat if space allows
        // Capacity rule: Farmer is always present/loadable, plus at most 1 item!
        if (key === 'farmer') {
          // Farmer toggle inside boat
          state.farmer = 'boat';
          sound.playPop();
        } else {
          // Check how many non-farmer items are already in boat
          const itemsInBoat = ['wolf', 'sheep', 'cabbage'].filter(k => state[k] === 'boat').length;
          if (itemsInBoat < 1) {
            state[key] = 'boat';
            // Auto load farmer if item is loaded for convenience
            if (state.farmer !== 'boat') state.farmer = 'boat';
            sound.playPop();
          } else {
            showBanner("⚠️ The boat can only carry 1 item with the farmer!");
          }
        }
      }
    }

    // Canvas click detection
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Scale coordinates to internal canvas resolution
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const canvasX = clickX * scaleX;
      const canvasY = clickY * scaleY;

      if (!window.interactiveBounds) return;

      for (let item of window.interactiveBounds) {
        if (
          canvasX >= item.x &&
          canvasX <= item.x + item.size &&
          canvasY >= item.y &&
          canvasY <= item.y + item.size
        ) {
          handleCharacterClick(item.key);
          return;
        }
      }
    });

    // Sail Boat Command
    function sailBoat() {
      if (state.isSailing || state.isGameOver) return;
      sound.init();

      // Rule: Farmer MUST be in the boat to row across!
      if (state.farmer !== 'boat') {
        showBanner("👨‍🌾 The Farmer must be in the boat to row!");
        sound.playOops();
        return;
      }

      state.isSailing = true;
      state.moves++;
      document.getElementById('moveCount').textContent = state.moves;
      sound.playSplash();

      const targetProgress = state.boatPos === 'left' ? 1 : 0;
      const duration = 1200; // ms
      const startTime = performance.now();
      const startProgress = boatProgress;

      function animateSail(now) {
        const elapsed = now - startTime;
        const p = Math.min(elapsed / duration, 1);

        // Smooth easing (easeInOutQuad)
        const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        boatProgress = startProgress + (targetProgress - startProgress) * ease;

        if (p < 1) {
          requestAnimationFrame(animateSail);
        } else {
          // Boat landed on target bank
          state.boatPos = state.boatPos === 'left' ? 'right' : 'left';
          
          // Auto unload farmer and items to destination bank
          ['farmer', 'wolf', 'sheep', 'cabbage'].forEach(k => {
            if (state[k] === 'boat') {
              state[k] = state.boatPos;
            }
          });

          state.isSailing = false;
          checkRulesAndGameState();
        }
      }

      requestAnimationFrame(animateSail);
    }

    /* ==========================================================================
       RULE VALIDATION & GAME OVER / WIN CHECKS
       ========================================================================== */
    function checkRulesAndGameState() {
      // Check for conflicts on both shores
      const sides = ['left', 'right'];

      for (let side of sides) {
        // Only trigger conflict if Farmer is NOT on that side
        if (state.farmer !== side) {
          const wolfHere = state.wolf === side;
          const sheepHere = state.sheep === side;
          const cabbageHere = state.cabbage === side;

          if (wolfHere && sheepHere) {
            // Wolf eats sheep!
            triggerLoss('wolf_eat_sheep');
            return;
          } else if (sheepHere && cabbageHere) {
            // Sheep eats cabbage!
            triggerLoss('sheep_eat_cabbage');
            return;
          }
        }
      }

      // Check Victory Condition: All 4 elements on 'right'
      if (
        state.farmer === 'right' &&
        state.wolf === 'right' &&
        state.sheep === 'right' &&
        state.cabbage === 'right'
      ) {
        triggerWin();
      }
    }

    function triggerLoss(type) {
      state.isGameOver = true;
      state.eatAnimation = { type: type, timer: 0 };
      sound.playOops();

      setTimeout(() => {
        let title = "Oh no! 🙈";
        let desc = "Be careful who you leave together without the farmer!";
        let emoji = "💥";

        if (type === 'wolf_eat_sheep') {
          desc = "The Wolf ate the Sheep! Remember, the Wolf can't be left alone with the Sheep!";
          emoji = "🐺🐑";
        } else if (type === 'sheep_eat_cabbage') {
          desc = "The Sheep ate the Cabbage! Keep the Sheep away from the Cabbage when the Farmer is gone.";
          emoji = "🐑🥬";
        }

        showModal(title, desc, emoji, false);
      }, 1400);
    }

    function triggerWin() {
      state.isGameOver = true;
      sound.playWin();

      // Launch Confetti
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      // Calculate Stars based on moves (Optimal is 7)
      let stars = 1;
      if (state.moves === 7) stars = 3;
      else if (state.moves <= 10) stars = 2;

      setTimeout(() => {
        showModal(
          "Victory! 🎉",
          `You got everyone across safely in ${state.moves} moves!`,
          "🏆",
          true,
          stars
        );
      }, 500);
    }

    /* ==========================================================================
       UI HELPERS & MODALS
       ========================================================================== */
    function showBanner(text) {
      const banner = document.getElementById('instructionBanner');
      banner.textContent = text;
      banner.classList.add('bg-amber-100', 'text-amber-900');
      setTimeout(() => {
        banner.textContent = "👇 Tap characters to load/unload into the boat!";
        banner.classList.remove('bg-amber-100', 'text-amber-900');
      }, 2500);
    }

    function showModal(title, desc, emoji, isWin, stars = 0) {
      const overlay = document.getElementById('modalOverlay');
      const card = document.getElementById('modalCard');
      const starBox = document.getElementById('starContainer');

      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDescription').textContent = desc;
      document.getElementById('modalEmoji').textContent = emoji;

      if (isWin) {
        starBox.classList.remove('hidden');
        const starEls = starBox.querySelectorAll('.star');
        starEls.forEach((el, idx) => {
          if (idx < stars) {
            el.classList.remove('opacity-30');
            el.classList.add('scale-125');
          } else {
            el.classList.add('opacity-30');
            el.classList.remove('scale-125');
          }
        });
      } else {
        starBox.classList.add('hidden');
      }

      overlay.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-90');
      card.classList.add('scale-100');
    }

    function hideModal() {
      const overlay = document.getElementById('modalOverlay');
      const card = document.getElementById('modalCard');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-100');
      card.classList.add('scale-90');
    }

    function resetGame() {
      state = {
        boatPos: 'left',
        farmer: 'left',
        wolf: 'left',
        sheep: 'left',
        cabbage: 'left',
        moves: 0,
        isSailing: false,
        isGameOver: false,
        eatAnimation: null
      };
      boatProgress = 0;
      document.getElementById('moveCount').textContent = '0';
      document.getElementById('hintBubble').classList.add('hidden');
      hideModal();
    }

    /* ==========================================================================
       HINT SYSTEM
       ========================================================================== */
    function getHint() {
      if (state.isGameOver) return;

      // Smart dynamic hint based on current state
      const { farmer, wolf, sheep, cabbage, boatPos } = state;

      let hintText = "";

      if (boatPos === 'left') {
        if (sheep === 'left' && wolf === 'left' && cabbage === 'left') {
          hintText = "💡 First, take the Sheep 🐑 across!";
        } else if (wolf === 'left' && cabbage === 'left' && sheep === 'right') {
          hintText = "💡 Take either the Wolf 🐺 or Cabbage 🥬 across next!";
        } else if (sheep === 'left' && (wolf === 'right' || cabbage === 'right')) {
          hintText = "💡 Take the remaining item across, but watch out for the Sheep!";
        } else if (sheep === 'left') {
          hintText = "💡 Bring the Sheep 🐑 to the right bank to finish!";
        } else {
          hintText = "💡 Load an item and sail across!";
        }
      } else {
        // Boat is on the right
        if (wolf === 'right' && sheep === 'right') {
          hintText = "💡 Bring the Sheep 🐑 BACK to the left bank so the Wolf won't eat it!";
        } else if (cabbage === 'right' && sheep === 'right') {
          hintText = "💡 Bring the Sheep 🐑 BACK so it doesn't eat the Cabbage!";
        } else {
          hintText = "💡 Sail back alone to pick up the next passenger!";
        }
      }

      const bubble = document.getElementById('hintBubble');
      bubble.textContent = hintText;
      bubble.classList.remove('hidden');
    }

    /* ==========================================================================
       EVENT LISTENERS & STARTUP
       ========================================================================== */
    document.getElementById('sailBtn').addEventListener('click', sailBoat);
    document.getElementById('restartBtn').addEventListener('click', resetGame);
    document.getElementById('modalActionBtn').addEventListener('click', resetGame);
    document.getElementById('hintBtn').addEventListener('click', getHint);

    document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
      sound.muted = !sound.muted;
      e.target.textContent = sound.muted ? '🔇' : '🔊';
    });

    // Start Game Loop
    window.onload = () => {
      render();
    };
  </script>
</body>
</html>
